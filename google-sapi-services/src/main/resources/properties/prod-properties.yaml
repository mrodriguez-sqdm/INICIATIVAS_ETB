# --- API Manager ---
api:
  id: "20978640"
    
google:
  protocol: "HTTPS"
  host: "identitytoolkit.googleapis.com"
  port: "443"
  basePath: "/v1/accounts"
  resources:
    lookup:
      path: ":lookup"
      post:
        method: "POST"
    signUp:
      path: ":signUp"
      post:
        method: "POST"
    update:
      path: ":update"
      post:
        method: "POST"
    delete:
      path: ":delete"
      post:
        method: "POST"
    signInWithPassword:
      path: ":signInWithPassword"
      post:
        method: "POST"
    signInWithCustomToken:
      path: ":signInWithCustomToken"
      post:
        method: "POST"

gcp:
  clientEmail: "idp-mulesoft@etb-identity-omnicanal.iam.gserviceaccount.com"

oauth:
  protocol: "HTTPS"
  host: "oauth2.googleapis.com"
  port: "443"
  resources:
    accessToken:
      path: "/token"
      post:
        method: "POST"