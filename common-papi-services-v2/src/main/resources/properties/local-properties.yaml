# ==============================================================================
#  LOCAL ENVIRONMENT PROPERTIES
#  Used for local development. Start with: -Denv=local
# ==============================================================================
  
# --- API Manager ---
api:
  id: "0"
    
# --- Silice SAPI HTTP Requester ---
siliceSapi:
  protocol: "HTTP"
  host: "mule-worker-internal-silice-sapi-services-dev.us-e2.cloudhub.io"
  port: "8091"
  basePath: "/v1"
  notifications:
    path: "/notifications"
    post:
      method: "POST"

# --- Oracle SAPI HTTP Requester ---
oracleSapi:
  protocol: "HTTP"
  host: "mule-worker-internal-oracle-sapi-services-dev.us-e2.cloudhub.io"
  port: "8091"
  basePath: "/v1"
  notifications:
    path: "/notifications"
    post:
      method: "POST"

# --- Mongo DB SAPI HTTP Requester ---
mongoDbSapi:
  protocol: "HTTP"
  host: "127.0.0.1"
  port: "8084"
  basePath: "/mongo/v1"
  notificationsCampaigns:
    path: "/notifications/campaigns"
    get:
      method: "GET"
  notificationsAudit:
    path: "/notifications/audit"
    post:
      method: "POST"
  notificationsAuditById:
    path: "/notifications/audit/{auditId}"
    patch:
      method: "PATCH"
  parametersRetention:
    path: "/parametersRetention"
    get:
      method: "GET"
  operators:
    path: "/operators"
    get:
      method: "GET"
  bussinessDays:
    path: "/bussinessDays"
    get:
      method: "GET"