# ==============================================================================
#  COMMON PROPERTIES
#  Shared across all environments (local, dev, qa, prod).
#  Environment-specific values override these in {env}.yaml files.
# ==============================================================================

# --- API Metadata ---
api:
  name: "common-papi-services-v2"
  version: "2.0.0"
  basePath: "/v2/*"

# --- HTTP Listener ---
http:
  private:
    host: "0.0.0.0"
    port: "8091"
    readTimeout: "120000"
    
# --- Silice SAPI HTTP Requester (defaults - override per environment) ---
siliceSapi:
  connectionIdleTimeout: "60000"
  responseTimeout: "15000"
  reconnection:
    frequency: "3000"
    count: "3"

# --- Oracle SAPI HTTP Requester (defaults - override per environment) ---
oracleSapi:
  connectionIdleTimeout: "60000"
  responseTimeout: "15000"
  reconnection:
    frequency: "3000"
    count: "3"
    
# --- Mongo DB SAPI HTTP Requester (defaults - override per environment) ---
mongoDbSapi:
  connectionIdleTimeout: "60000"
  responseTimeout: "15000"
  reconnection:
    frequency: "3000"
    count: "3"

# --- Directv SAPI HTTP Requester (defaults - override per environment) ---
directvSapi:
  connectionIdleTimeout: "60000"
  responseTimeout: "15000"
  reconnection:
    frequency: "3000"
    count: "3"
    
# --- Azure SAPI HTTP Requester (defaults - override per environment) ---
