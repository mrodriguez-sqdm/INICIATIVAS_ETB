  reconnection:
    frequency: "3000"
    count: "3"

# --- DataLogic SAPI HTTP Requester (defaults - override per environment) ---
dataLogicSapi:
  connectionIdleTimeout: "60000"
  responseTimeout: "15000"
  reconnection:
    frequency: "3000"
    count: "3"

# --- Client SAPI HTTP Requester (defaults - override per environment) ---
clientSapi:
  connectionIdleTimeout: "60000"
  responseTimeout: "15000"
  reconnection:
    frequency: "3000"
    count: "3"
    
# --- Pagination Details ---
pagination:
  profile: "${PAGINATION_PROFILE:Bajo}"
  profiles:
    bajo:
      max: "${PAGINATION_BAJO_MAX:25}"
    medio:
      max: "${PAGINATION_MEDIO_MAX:50}"
    alto:
      max: "${PAGINATION_ALTO_MAX:100}"
  default:
    offset: "0"