# --- API Manager ---
api:
  id: "20577937"

# --- Mongo DB SAPI HTTP Requester ---
mongoDbSapi:
  protocol: "HTTP"
  host: "mule-worker-internal-mongo-db-sapi-services-qa.us-e2.cloudhub.io"
  port: "8091"
  basePath: "/mongo/v1"
  collections:
    userIDP: "PORTAL_UNIFICADO_USUARIO"
  parametersRetention:
    path: "/parametersRetention"
    get:
      method: "GET"
  operators:
    path: "/operators"
    get:
      method: "GET"
  bussinessDays:
    path: "/bussinessDays"
    get:
      method: "GET"
  dynamicQuery:
    path: "/dynamicQuery"
    post:
      method: "POST"
  botChannel:
    path: "/bots/channels"
    get:
      method: "GET"
  botSystem:
    path: "/bots/systems"
    get:
      method: "GET"
  service:
    path: "/service"
    technology: "LTE"
    get:
      method: "GET"
  serviceActive:
    path: "/serviceActive"
    technology: "FTTH"
    get:
      method: "GET"
  customer:
    path: "/customer"
    get:
      method: "GET"
  pqr:
    path: "/pqrs"
    post:
      method: "POST"
  pqrCategory:
    path: "/pqrs/categories"
    get:
      method: "GET"
  pqrDuplicate:
    path: "/pqrs/duplicates"
    get:
      method: "GET"
  pqrParent:
    path: "/pqrs/parents"
    get:
      method: "GET"

# --- DirectTV SAPI HTTP Requester ---
directvSapi:
  protocol: "HTTP"
  port: "8091"
  host: "mule-worker-internal-directv-sapi-services-qa.us-e2.cloudhub.io"
  basePath: "/v1"
  customer:
    path: "/customers"
    post:
      method: "POST"
  customerId:
    path: "/customers/{customerId}"
    get:
      method: "GET"
  customerProduct:
    path: "/customers/{customerId}/products"
    post:
      method: "POST"
  customerNotification:
    path: "/customers/{customerId}/notifications/email"
    post:
      method: "POST"

