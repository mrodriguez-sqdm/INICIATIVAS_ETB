http:
  listener:
    host: "0.0.0.0"
    port: "8081"
    readTimeout: "30000"

autodiscovery: "20873649"

oauth:
  provider:
    rateLimiter:
      duration: "600"
      maxFailures: "5"

    grantTypes: "CLIENT_CREDENTIALS"

    token:
      path: "/v1/oauth/token"
      ttl: "3600"

objectstore:
  token:
    maxEntries: "10000"
    entryTtl: "3600"
    expirationInterval: "60"

  client:
    maxEntries: "10000"
    entryTtl: "0"
    expirationInterval: "3600"
    
tls:
  type: "JKS"
  path: "security/keystore.jks"
  keyPassword: "password"
  password: "password"
    
audits-sapi:
  protocol: "HTTP"
  host: "mule-worker-internal-audits-oracle-sapi-services-qa.us-e2.cloudhub.io"
  port: "8091"
  basePath: "/api/v1/logs"
  path: "/systems/{system_id}/apis/{api_id}"
  client_id: "b8665f3c588a4a709576760a1cc5a582"
  client_secret: "7417c6490e8943FDBCDB907d30e9f2f7"