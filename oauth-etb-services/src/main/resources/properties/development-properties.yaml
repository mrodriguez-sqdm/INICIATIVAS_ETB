http:
  listener:
    host: "0.0.0.0"
    port: "8081"
    readTimeout: "30000"

autodiscovery: ""

oauth:
  provider:
    rateLimiter:
      duration: "600"
      maxFailures: "5"

    grantTypes: "CLIENT_CREDENTIALS"

    token:
      path: "/v1/oauth/token"
      ttl: "3600"

objectstore:
  token:
    maxEntries: "10000"
    entryTtl: "3600"
    expirationInterval: "60"

  client:
    maxEntries: "10000"
    entryTtl: "0"
    expirationInterval: "3600"
    
