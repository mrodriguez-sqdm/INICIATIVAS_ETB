http:
  private:
    host: "${app.listener.host}"
    port: "${app.listener.port}"

app:
  name: "${project.artifactId}"
  version: "${project.version}"
  ramlVersion: "${ramlVersion}"
    
org:
  id: "${etb.orgId}"

jsonLogger:
  disabledFields: ""
  contentFieldsDataMasking: ""

wompi:
  paths:
    getAcceptanceTokens: "merchants/{merchant_public_key}"
    getBanks: "pse/financial_institutions"
    createTransaction: "transactions"
    getTransactionById: "transactions/{transaction_id}"
    voidTransactionById: "transactions/{transaction_id}/void"
    createPaymentLinks: "payment_links"
    getPaymentLinkById: "payment_links/{payment_link_id}"
    patchPaymentLinkById: "payment_links/{payment_link_id}"