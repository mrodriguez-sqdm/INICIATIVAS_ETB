http:
  private:
    host: "0.0.0.0"
    port: "8091"
    
app:
  listener:
    basePath: "/api/*"    

wompi:
  getAcceptanceTokens: 
    method: "GET"
    path: "/merchants/{merchant_public_key}"
  getBanks: 
    method: "GET"
    path: "/pse/financial_institutions"
  postTransaction:
    method: "POST"
    path: "/transactions"
  getTransactionById:
    method: "GET"
    path: "/transactions/{transaction_id}"
  patchTransactionById:
    method: "PATCH"
    path: "/transactions/{transaction_id}/void"
  postPaymentLinks:
    method: "POST"
    path: "/payment_links"
  getPaymentLinkById: 
    method: "GET"
    path: "/payment_links/{payment_link_id}"
  patchPaymentLinkById:
    method: "PATCH"
    path: "/payment_links/{payment_link_id}"