# --- HTTP Listener ---
http:
  private:
    host: "0.0.0.0"
    port: "8091"
    readTimeout: "10000"

# --- API Metadata ---
api: 
  id: "0"
  name: "data-logic-sapi-services"
  version: "1.0.0"
  basePath: "/v1/*"

# --- HTTP MDM_Data_Services SOAP Requester ---
mdm_data_services:
  soap:
    protocol: "https://"
    wsdlHost: "servicios.qa.etb.co"
    wsdlPort: "82"
    wsdlPath: "/MDM_Data_Services/MDM_Data_Services.asmx?wsdl"
    service: "MDM_Data_Services"
    servicePort: "MDM_Data_ServicesSoap"
    address: "/MDM_Data_Services/MDM_Data_Services.asmx"
    operations: 
      setPqr: "Set_PQR"
      setOrder: "Set_Order"
      setOrderPhase: "Set_Order_Phase"
      setOrderBundleOrden: "Set_Order_Bundle_Orden"

# --- ConsultaInventario SOAP Requester ---
consultaInventario:
  soap:
    protocol: "https://"
    wsdlHost: "vistas.qa.etb.co"
    wsdlPort: "90"
    wsdlPath: "/Services/ConsultaInventario/ConsultaInventario.svc?wsdl"
    service: "ConsultaInventario"
    servicePort: "BasicHttpsBinding_IConsultaInventario"
    address: "/Services/ConsultaInventario/ConsultaInventario.svc"
    operations:
      getResourceInventory: "ConsultarInventarioTipoRecurso"

# --- GestionarInventarioLTE SOAP Requester ---
gestionarInventarioLTE:
  soap:
    protocol: "https://"
    wsdlHost: "vistas.qa.etb.co"
    wsdlPort: "90"
    wsdlPath: "/InventarioServiceLTE.svc?wsdl"
    service: "InventarioServiceLTE"
    servicePort: "BasicHttpsBinding_IInventarioServiceLTE"
    address: "/InventarioServiceLTE.svc"
    operations:
      lteResources: "GestionarInventarioLTE"

# --- ServiceOrchestrator SOAP Requester ---
serviceOrchestrator:
  soap:
    protocol: "https://"
    wsdlHost: "servicios.qa.etb.co"
    wsdlPort: "82"
    wsdlPath: "/MDM_Orquestador/MDMOrchestrationService.svc?wsdl"
    service: "MDMOrchestrationService"
    servicePort: "BasicHttpsBinding_IMDMOrchestrationService"
    address: "/MDM_Orquestador/MDMOrchestrationService.svc"
    operations:
      serviceOrchestration: "RunOrchService"