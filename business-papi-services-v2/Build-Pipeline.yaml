parameters:
- name: apiName
  type: string

steps:

- powershell: |

    $source = "$(Pipeline.Workspace)/Properties_Mulesoft_Prod/APIS/${{ parameters.apiName }}/prod-properties.yaml"
    $target = "$(Pipeline.Workspace)/s/APIS/${{ parameters.apiName }}/src/main/resources/prod-properties.yaml"

    Write-Host ""
    Write-Host "Looking for source: $source"
    Write-Host "Target: $target"

    if (-not (Test-Path $source)) {
      Write-Error "Source file not found. Check the folder structure printed above."
      exit 1
    }

    if (-not (Test-Path (Split-Path $target))) {
      Write-Error "Target directory does not exist: $(Split-Path $target)"
      exit 1
    }

    Copy-Item $source $target -Force
    Write-Host "Replaced successfully"
  displayName: Replace properties.yaml

- task: Maven@4
  displayName: Build ${{ parameters.apiName }}
  inputs:
    mavenPomFile: APIS/${{ parameters.apiName }}/pom.xml
    goals: 'clean install -U'
    options: '-DskipMunitTests'

- task: PublishBuildArtifacts@1
  displayName: Publish ${{ parameters.apiName }}
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/APIS/${{ parameters.apiName }}/target/$(artifactId)-$(version)-$(packaging).jar'
    ArtifactName: ${{ parameters.apiName }}
