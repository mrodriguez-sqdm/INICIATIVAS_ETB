http:
  private:
    port: "8091"

autodiscovery: "20822902"

configurationTimeout:
  product-papi-v2-listener: "62000"
  jsc-sapi:
    responseTimeout: "60000"
    connectionIdleTimeout: "30000"

jsc-sapi:
  protocol: "HTTP"
  port: "8091"
  host: "mule-worker-internal-jsc-sapi-services-qa.us-e2.cloudhub.io"
  basePath: "/jsc/v1"
  recharge:
    path: "/topup"
    currency: "COP"
    errorMessage: "Error while recharging the phone"
  subscriber:
    path: "/subscriber"
    subscriberType: "EXTERNAL"
    errorMessage: "Error retrieving subscriber"
    patch-resource: "/subscriber/{id}"
  subscription:
    path: "/subscription"
    getBySID: "/subscription/group/{SID}"
    msisdn: "/{msisdn}/imei"
    errorMessage: "Error retrieving info subscription"
    get-svas:
      caracteristica: "JSC ID"
  consumption:
    path: "/consumption/{id}/details"
    errorMessage: "Error while obtaining consumption details"
  order:
    path: "/order"
    type: "RETAIL"
    salesChannel: "OWN_CALLCENTER"
    status: "CONFIRMED"
    errorMessage: "Error creating order"
    endOrder:
      path: "/order/{id}"
      action: "APPLY"
      errorMessage: "Error closing order"
  msisdn:
    path:
      patch-msisdn-status: "/msisdn/{msisdn}"
      post-activateLine: "/msisdn/{msisdn}/{order_id}"
      get-disponibilidad: "/msisdn/{msisdn}"
      post-msisdn: "/msisdn"
    actionUpdateStatus: "MODIFY"
    product: "FWA"
    errorMessage: "Error associating msisdn"
    pool:
      id: "654654"
      name: "PoolMsisdn_ETBMVNE"
    sourcePool:
      id: "65321"
      name: "ETB_ChangeMsisdn"
  simcard:
    path:
      post-activateLine: "/sim/{iccid}/{order_id}"
      get-disponibilidad: "/sim/{iccid}"
    errorMessage: "Error associating simcard"
  createBillingAccount:
    ba:
      path: "/billing/ba"
      name: "Creating a new BillingAccount"
      errorMessage: "Error creating billing account ba"
      errorMessage2: "Error retrieving info billing account ba"
    subscription:
      path: "/subscription/{subscription_id}"
      action: "MODIFY"
      name: "Name"
      errorMessage: "Error creating billing account subscription"
      errorMessage2: "Error updating status"
      errorMessage3: "Error terminating the subscription"
      nameMoveSubsc: "Moving subscription to billing account cycle"
      nameAddMember: "Add member to group"
  pkgi:
    path: "/pkgi/{pkgi_id}"
    getbySID: "/pkgi"
    patch-pkgi: "/pkgi/{pkgi_id}"
    errorMessage-get: "Error al Obtener PKGI"
    errorMessage-patch: "Error al eliminar el PKGI"
  groupInstance:
    path: "/groupinstance/{groupInstanceId}/member"
    getById: "/groupinstance/member"
    deleteById: "/groupinstance/{groupInstanceId}/member/{memberId}"
    errorMessage-get: "Error al consultar member del group"
    errorMessage-delete: "Error al eliminar la linea hija del grupo"
    errorMessage-post: "No se pudo agregar línea hija al grupo"
  assignSubscriptionToSubscriber:
    path: "/subscription/{subscription_id}/change-owner/{subscriber_id}"
  subscription-id-feature:
    path: /subscription/{subscription_id}/features
    errorMessage-get: "Error while trying to obtain data from the subscription-feature"
    errorMessage-patch: "Error while trying to update data from the subscription-feature"
  balance-structured:
    path: "/balance"
    errorMessage: "Error while obtaining balance consumption details"
    size: "100"
    status: "ACTIVE"
  transferbalance:
    path: "/transferbalance"
    errorMessage: "Error while transfer balance"
    channel: "BALANCE_TRANSFER"
    comment: "Transferencia de saldo"
    currency: "COP"
  smpp:
    path: "/smpp/sendMessage"
  client_id: "b8665f3c588a4a709576760a1cc5a582"
  client_secret: "7417c6490e8943FDBCDB907d30e9f2f7"

audits-sapi:
  protocol: "HTTP"
  host: "mule-worker-internal-audits-oracle-sapi-services-qa.us-e2.cloudhub.io"
  port: "8091"
  basePath: "/api/v1/logs"
  path: "/systems/{system_id}/apis/{api_id}"
  client_id: "b8665f3c588a4a709576760a1cc5a582"
  client_secret: "7417c6490e8943FDBCDB907d30e9f2f7"
