# ==============================================================================
#  COMMON PROPERTIES
#  Shared across all environments (local, dev, qa, prod).
#  Environment-specific values override these in {env}.yaml files.
# ==============================================================================

# --- API Metadata ---
api:
  name: "mule-api-template"
  version: "1.0.0"
  basePath: "/v1/*"

# --- HTTP Listener ---
http:
  private:
    host: "0.0.0.0"
    port: "8091"
    readTimeout: "10000"
    
backend:
  connectionIdleTimeout: "30000"
  responseTimeout: "30000"
  reconnection:
    frequency: "3000"
    count: "3"
    
rules-id:
 data-client: "REG-DATOS-CLIENTE-001"
 validate-identity: "REG-VALIDACION-IDENTIDAD-001"
 data-service: "REG-DATOS-SERVICIOS-001"

mongo-db-sapi:
  collections:
   client: "MDM_CLIENTE"
   identity-validation: "MDM_VALIDACION_CLIENTE"
   services-fija: "MDM_CD_SERVICIO"
   services-movil: "MDM_SERVICIO_ACTIVO"
   consecutives: "MDM_CD_CONSECUTIVO"
   par-consecutives: "PAR_CONSECUTIVOS"
   orden-fija: "MDM_CD_ORDEN"
   orden-movil: "MDM_ORDEN"
   facturacion: "MDM_CUENTA_FACTURACION"
   catalogo: "MDM_CD_CLASE_SERVICIO"

execution-context-cache-clase-servicio:
  entryTTL: "1"
  entryTtlUnit: "DAYS"             # valores permitidos SECONDS,MINUTES,HOURS,DAYS
  expirationInterval: "1"
  expirationIntervalUnit: "HOURS"
  
scheduler-clase-servicio:
  cron-expression: "0 0 5 * * ?"      # Todos los dias a las 05:00:00
  time-zone: "America/Bogota"         # Hora de Colombia (UTC-5)
