http:
  private:
    host: "${app.listener.host}"
    port: "${app.listener.port}"

app:
  name: "${project.artifacId}"
  version: "${pom.version}"

payu:
  paymentsService: "/payments-api/4.0/service.cgi"
  reportsService: "/reports-api/4.0/service.cgi"
  language: "es"
  paymentCountry: "CO"
  getBanks:
    method: "POST"
    command: "GET_BANKS_LIST"
    paymentMethod: "PSE"   
  getPaymentTransaction:
    method: "POST"
    command: "TRANSACTION_RESPONSE_DETAIL"
  getPing:
    method: "POST"
    command: "PING"
  postPaymentTransaction:
    method: "POST"
    command: "SUBMIT_TRANSACTION"
    type: "AUTHORIZATION_AND_CAPTURE"
