##APP CONFIG##
http:
  private:
    host: "${app.listener.host}"
    port: "${app.listener.port}"

app:
  name: "${project.artifacId}"
  version: "${pom.version}"

##TLS CONFIG##
tls:
  type: "JKS"
  path: "security/keystore.jks"
  
##CUSTOMER PAPI V2 CONFIG##
customerPapi:
  responseTimeout: "15000"
  getCustomer:
    method: "GET"
    path: "/customer"
  getCustomer360:
    method: "GET"
    path: "/customer360"

##PAYMENT PAPI CONFIG##
paymentPapi:
  responseTimeout: "15000"
  getBanks:
    method: "GET"
    path: "/v1/{paymentMethod}/banks"
  postPayment:
    method: "POST"
    path: "/v1/{paymentMethod}/payment"
  getPayment:
    method: "GET"
    path: "/v1/{paymentMethod}/payment/{paymentId}"
  patchPayment:
    method: "PATCH"
    path: "/v1/{paymentMethod}/payment/{paymentId}"