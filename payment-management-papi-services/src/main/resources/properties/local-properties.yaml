app:
  id: "20497177"
  listener:
    host: "localhost"
    port: "8082"
    basepath: "/api/v1/*"

secure:
  key: "PAYMENT_MGMT_PAPI_LOCAL_KEY"

payu-sapi:
  host: "localhost"
  port: "8092"
  basepath: "/api/v1"
  fields:
    accountId: "512321"
    type: "AUTHORIZATION_AND_CAPTURE"

wompi-sapi:
  host: "localhost"
  port: "8091"
  basepath: "/api/v1/wompi"

pse-sapi:
  host: "localhost"
  port: "8086"
  basepath: "/sisext/v1/pse"
  fields:
    entityCode: "8999991158"
    serviceCode: "181500017"
    beneficiaryEntityIdentificationType: "NIT"
    beneficiaryEntityIdentification: "899999115"
    beneficiaryEntityName: "ETB" # Reemplazar por el nombre correcto de la entidad beneficiaria en pse
    beneficiaryEntityCIIUCategory: "6110"
    indicator4per1000: "0"

mongo-sapi:
  host: "localhost"
  port: "8084"
  basepath: "/mongo/v1"

pagination:
  profile: "${PAGINATION_PROFILE:Bajo}"
  profiles:
    bajo:
      max: "${PAGINATION_BAJO_MAX:25}"
    medio:
      max: "${PAGINATION_MEDIO_MAX:50}"
    alto:
      max: "${PAGINATION_ALTO_MAX:100}"
  default:
    offset: "0"
