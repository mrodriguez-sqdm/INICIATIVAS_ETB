##APP CONFIG##
app:
  name: "${project.artifactId}"
  version: "${project.version}"

http:
  private:
    host: "${app.listener.host}"
    port: "${app.listener.port}"

##PAYU SAPI CONFIG##
payu-sapi:
  getBanks:
    method: "GET"
    path: "/banks"
  getPayment:
    method: "GET"
    path: "/transactions/{id}"
  postPayment:
    method: "POST" 
    path: "/transactions"
  patchPayment:
    method: "PATCH"
    path: "/transactions/{id}"

##WOMPI SAPI CONFIG##
wompi-sapi:
  getBanks:
    method: "GET"
    path: "/banks"

wompi-checkout-sapi:
  getPayment:
    method: "GET"
    path: "/payment_links/{payment_link_id}"
  postPayment: 
    method: "POST"
    path: "/payment_links"
  patchPayment:
    method: "PATCH"
    path: "/payment_links/{payment_link_id}"
    
##SISEXT SAPI PSE CONFIG## 
pse-sapi:
  getBanks:
    method: "GET"
    path: "/banks"
  getPayment:
    method: "GET"
    path: "/transactions/{id}"
  postPayment:
    method: "POST"
    path: "/transactions"
  patchPayment:
    method: "PATCH"
    path: "/transactions/{id}"
    
##MONGO SAPI CONFIG##
mongo-sapi:
  getPayment:
    method: "GET"
    path: "/transactions"
  postPayment:
    method: "POST"
    path: "/transactions"
  patchPayment:
    method: "PATCH" 
    path: "/transactions"
    
 

