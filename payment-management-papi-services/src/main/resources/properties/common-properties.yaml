##APP CONFIG##
app:
  name: "${project.artifactId}"
  version: "${project.version}"

http:
  private:
    host: "${app.listener.host}"
    port: "${app.listener.port}"

##PAYU SAPI CONFIG##
payu-sapi:
  getBanks:
    method: "GET"
    path: "/banks"
  getPayment:
    method: "GET"
    path: "/transactions/{id}"
  postPayment:
    method: "POST" 
    path: "/transactions"
  patchPayment:
    method: "PATCH"
    path: "/transactions/{id}"

##WOMPI SAPI CONFIG##
wompi-sapi:
  getBanks:
    method: "GET"
    path: "/banks"
  postTokenCards:
    method: "POST"
    path: "/tokensCards"
  getAcceptanceTokens:
    method: "GET"
    path: "/acceptanceTokens"
    
wompi-api-sapi:
  getPayment:
    method: "GET"
    path: "/transactions/{transaction_id}"
  postPayment: 
    method: "POST"
    path: "/transactions"
  patchPayment:
    method: "PATCH"
    path: "/transactions/{transaction_id}"
    
wompi-checkout-sapi:
  getPayment:
    method: "GET"
    path: "/payment_links/{payment_link_id}"
  postPayment: 
    method: "POST"
    path: "/payment_links"
  patchPayment:
    method: "PATCH"
    path: "/payment_links/{payment_link_id}"
    
##SISEXT SAPI PSE CONFIG## 
pse-sapi:
  getBanks:
    method: "GET"
    path: "/banks"
  getPayment:
    method: "GET"
    path: "/transactions/{id}"
  postPayment:
    method: "POST"
    path: "/transactions"
  patchPayment:
    method: "PATCH"
    path: "/transactions/{id}"
    
##MONGO SAPI CONFIG##
mongo-sapi:
  getPayment:
    method: "GET"
    path: "/transactions/{transaccionId}"
  postPayment:
    method: "POST"
    path: "/transactions"
  patchPayment:
    method: "PATCH" 
    path: "/transactions/{id}"
  postPaymentAudit:
    method: "POST" 
    path: "/transactions/audit"

##AZURE SAPI CONFIG##
azure-sapi:
  postPaymentEvent:
    method: "POST"
    path: "/payments/events"
    
pagination:
  profile: "${PAGINATION_PROFILE:Bajo}"
  profiles:
    bajo:
      max: "${PAGINATION_BAJO_MAX:25}"
    medio:
      max: "${PAGINATION_MEDIO_MAX:50}"
    alto:
      max: "${PAGINATION_ALTO_MAX:100}"
  default:
    offset: "0"
