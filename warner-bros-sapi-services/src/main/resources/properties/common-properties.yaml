# ==============================================================================
#  COMMON PROPERTIES
#  Shared across all environments (local, dev, qa, prod).
#  Environment-specific values override these in {env}.yaml files.
# ==============================================================================

# --- API Metadata ---
api:
  name: "warner-bros-sapi-service"
  version: "1.0.0"
  basePath: "/v1/*"

# --- HTTP Listener ---
http:
  private:
    host: "0.0.0.0"
    port: "8091"
    readTimeout: "10000"
    