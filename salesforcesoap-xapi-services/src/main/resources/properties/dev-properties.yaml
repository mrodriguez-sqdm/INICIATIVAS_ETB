http:
  private:
    host: "localhost"
    port: "8081"

api:
  listener:
    basepath: "/BillingCorporate"
  connectionIdle:
    timeout: "30000"
  request:
    timeout: "15000"
    reconnection:
      frequency: "5000"
      attempts: "3"

billingPapi:
  host: "mule-worker-internal-billing-papi-services-dev.us-e2.cloudhub.io"
  port: "8091"
  basepath: "/billing/v1"
  systemId: "MIGRACION"
  postBillingAccounts:
    method: "POST"
    path: "/billing_accounts"