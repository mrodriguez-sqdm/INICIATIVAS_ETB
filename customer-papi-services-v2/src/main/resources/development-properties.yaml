customer360:
  fields:
    all: "customer;products;notifications;interactions;pqrs;billings;withholdings;promotions;services;orders;scheduling"
    customer: "get-customer-info-subflow"
    products: "get-products-info-subflow"
    notifications: "get-notifications-info-subflow"
    interactions: "get-interactions-info-subflow"
    pqrs: "get-pqrs-info-subflow"
    billings: "get-billings-info-subflow"
    withholdings: "get-withholdings-info-subflow"
    promotions: "get-promotions-info-subflow"
    services: "get-services-info-subflow"
    orders: "get-orders-info-subflow"
    scheduling: "get-scheduling-info-subflow"

pagination:
  profile: "${PAGINATION_PROFILE:Bajo}"
  profiles:
    bajo:
      max: "${PAGINATION_BAJO_MAX:25}"
    medio:
      max: "${PAGINATION_MEDIO_MAX:50}"
    alto:
      max: "${PAGINATION_ALTO_MAX:100}"
  default:
    offset: "0"
    
execution-context-cache-clase-servicio:
  entryTTL: "1"
  entryTtlUnit: "DAYS"             # valores permitidos SECONDS,MINUTES,HOURS,DAYS
  expirationInterval: "1"
  expirationIntervalUnit: "HOURS"

scheduler-clase-servicio:
  cron-expression: "0 0 5 * * ?"      # Todos los dias a las 05:00:00
  time-zone: "America/Bogota"         # Hora de Colombia (UTC-5)
