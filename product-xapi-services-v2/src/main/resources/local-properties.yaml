# Entorno local - product-xapi-services-v2
env: "local"

https:
  host: "0.0.0.0"
  port: "443"

tls:
  type: "JKS"
  path: "security/keystore.jks"
  keyPassword: "password"
  password: "password"

http:
  private:
    port: "51375"

autodiscovery: "0"

configurationTimeout:
  product-xapi-v2-listener: "30000"
  product-papi-v2:
    responseTimeout: "60000"
    connectionIdleTimeout: "30000"

# Cliente Product PAPI v2 (capa que invoca esta XAPI)
product-papi-v2:
  protocol: "HTTP"
  host: "localhost"
  port: "51374"
  base-path: "/v2"
  security:
    client_id: "b8665f3c588a4a709576760a1cc5a582"
    client_secret: "7417c6490e8943FDBCDB907d30e9f2f7"
  resources:
    usageConsumptionReport:
      path: "/usageConsumptionReport"
    usageConsumption:
      path: "/usageConsumption"
    billingProductSynchronization:
      path: "/billingProductSynchronization"
    subscription:
      path: "/subscription/{msisdn}"

# Audits (requerido por error-handler / loggin desde etb-common-lib)
audits-sapi:
  protocol: "HTTP"
  host: "localhost"
  port: "8091"
  basePath: "/api/v1/logs"
  path: "/systems/{system_id}/apis/{api_id}"
  client_id: "b8665f3c588a4a709576760a1cc5a582"
  client_secret: "7417c6490e8943FDBCDB907d30e9f2f7"
