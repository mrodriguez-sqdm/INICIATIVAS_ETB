# ==============================================================================
#  DEV ENVIRONMENT PROPERTIES
#  Used for development environment. Start with: -Denv=development
# ==============================================================================

# --- API Manager ---
api:
  id: "0"

# --- Common PAPI HTTP Requester ---
commonPapi:
  protocol: "HTTP"
  host: "mule-worker-internal-common-papi-services-v2-dev.us-e2.cloudhub.io"
  port: "8091"
  basePath: "/v2"
  parameters:
    path: "/parameters"
    get:
      method: "GET"
  documents:
    path: "/documents"
    post:
      method: "POST"
  troubleTicket:
    path: "/troubleTicket"
    post:
      method: "POST"
  communicationThirdPartyMessage:
    path: "/communications/third-party/message"
    post:
      method: "POST"
  userIdp:
    path: "/userIdp"
    post:
      method: "POST"
    get:
      method: "GET"
    login:
     path: "/login"
  userIdpById:
    path: "/userIdp/{id}"
    patch:
      method: "PATCH"