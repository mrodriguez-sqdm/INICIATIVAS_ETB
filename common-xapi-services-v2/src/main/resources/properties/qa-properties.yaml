# ==============================================================================
#  QA ENVIRONMENT PROPERTIES
#  Used for QA/staging environment. Start with: -Denv=qa
# ==============================================================================

# --- API Manager ---
api:
  id: "20577952"

# --- Common PAPI HTTP Requester ---
commonPapi:
  protocol: "HTTP"
  host: "mule-worker-internal-common-papi-services-v2-qa.us-e2.cloudhub.io"
  port: "8091"
  basePath: "/v2"
  parameters:
    path: "/parameters"
    get:
      method: "GET"
  documents:
    path: "/documents"
    post:
      method: "POST"
  troubleTicket:
    path: "/troubleTicket"
    post:
      method: "POST"
  communicationThirdPartyMessage:
    path: "/communications/third-party/message"
    post:
      method: "POST"
  userIdp:
    path: "/userIdp"
    post:
      method: "POST"
    get:
      method: "GET"
    delete:
      method: "DELETE"
    login:
     path: "/login"
  userIdpById:
    path: "/userIdp/{id}"
    patch:
      method: "PATCH"

# --- Operations PAPI HTTP Requester ---
operationsPapi:
  protocol: "HTTP"
  host: "mule-worker-internal-operations-papi-services-qa.us-e2.cloudhub.io" 
  port: "8091"
  basePath: "/operations/v1"
  incident:
    path: "/incident/{ticketNumber}"
    get:
      method: "GET"