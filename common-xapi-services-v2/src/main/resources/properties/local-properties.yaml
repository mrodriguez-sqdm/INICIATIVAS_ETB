# ==============================================================================
#  LOCAL ENVIRONMENT PROPERTIES
#  Used for development environment. Start with: -Denv=local
# ==============================================================================

# --- API Manager ---
api:
  id: "0"

# --- Common PAPI HTTP Requester ---
commonPapi:
  protocol: "HTTP"
  host: "localhost"
  port: "8091"
  basePath: "/v2"
  parameters:
    path: "/parameters"
    get:
      method: "GET"
  documents:
    path: "/documents"
    post:
      method: "POST"
  troubleTicket:
    path: "/troubleTicket"
    post:
      method: "POST"
  communicationThirdPartyMessage:
    path: "/communications/third-party/message"
    post:
      method: "POST"
  userIdp:
    path: "/userIdp"
    post:
      method: "POST"
    get:
      method: "GET"
    delete:
      method: "DELETE"
    login:
     path: "/login"
  userIdpById:
    path: "/userIdp/{id}"
    patch:
      method: "PATCH"
  jwks:
    path: "/security/ott/jwks"
    get:
      method: "GET"   