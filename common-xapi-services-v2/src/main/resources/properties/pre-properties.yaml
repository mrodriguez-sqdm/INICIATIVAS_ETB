# ==============================================================================
#  PRE ENVIRONMENT PROPERTIES
#  Used for PRE/staging environment. Start with: -Denv=pre
# ==============================================================================

# --- API Manager ---
api:
  id: "20778779"

commonPapi:
  protocol: "HTTP"
  host: "mule-worker-internal-common-papi-services-v2-pre.us-e2.cloudhub.io"
  port: "8091"
  basePath: "/v2"
  parameters:
    path: "/parameters"
    get:
      method: "GET"
  documents:
    path: "/documents"
    post:
      method: "POST"
  communications:
    base-path: "/communications"
    third-party:
      path: "/third-party"
      message:
        path: "/message"
  commMessage:
    path: "/communications/message"
    post:
      method: "POST"
    userIdp:
      base-path: "/userIdp"
      post:
        path: ""
      get:
       path: ""
      patch:
       path: "/{id}"
  troubleTicket:
    path: "/troubleTicket"
    post:
      method: "POST"
    patch:
      method: "PATCH"
  communicationThirdPartyMessage:
    path: "/communications/third-party/message"
    post:
      method: "POST"
  userIdp:
    path: "/userIdp"
    post:
      method: "POST"
    get:
      method: "GET"
    delete:
      method: "DELETE"
    login:
     path: "/login"
  userIdpById:
    path: "/userIdp/{id}"
    patch:
      method: "PATCH"
  jwks:
    path: "/security/ott/jwks"
    get:
      method: "GET"
  topicMessage:
    path: "/topic/{command}/message"
    post:
      method: "POST"

# --- Operations PAPI HTTP Requester ---
operationsPapi:
  protocol: "HTTP"
  host: "mule-worker-internal-operations-papi-services-pre.us-e2.cloudhub.io" 
  port: "8091"
  basePath: "/operations/v1"
  incident:
    path: "/incident"
    get:
      method: "GET"
    post:
      method: "POST"