# ==============================================================================
#  COMMON PROPERTIES
#  Shared across all environments (local, dev, qa, prod).
#  Environment-specific values override these in {env}.yaml files.
# ==============================================================================

# --- API Metadata ---
api:
  name: "common-xapi-services-v2"
  version: "2.0.0"
  basePath: "/v2/*"

# --- HTTP Listener ---
https:
  host: "0.0.0.0"
  port: "443"
  readTimeout: "10000"
    
# --- TLS Context ---
tls:
  type: "JKS"
  path: "security/keystore.jks"
    
# --- Common PAPI HTTP Requester (defaults - override per environment) ---
commonPapi:
  connectionIdleTimeout: "30000"
  responseTimeout: "30000"
  reconnection:
    frequency: "3000"
    count: "3"